[workspace]
members = [
    "acbu_minting",
    "acbu_burning",
    "acbu_oracle",
    "acbu_reserve_tracker",
    "acbu_savings_vault",
    "acbu_lending_pool",
    "acbu_escrow",
    "acbu_multisig",
    "shared",
]
resolver = "2"

# Build script for WASM integrity verification
build = "build.rs"

# ---------------------------------------------------------------------------
# Workspace-wide dependency versions — the single source of truth.
#
# Every contract must reference these via `{ workspace = true }` rather than
# pinning its own version. This keeps the soroban-sdk version (which defines
# the shared ABI types) identical across all contracts, so cross-contract
# calls stay ABI-compatible. Per-crate feature flags (e.g. "alloc",
# "testutils") are still added at the member level.
# ---------------------------------------------------------------------------
[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Enable link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Strip symbols
overflow-checks = true

[profile.release-with-logs]
inherits = "release"
debug = true

# ---------------------------------------------------------------------------
# Workspace-wide lint policy — enforced by `cargo clippy` in CI.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unused_imports    = "deny"   # the original hygiene issue; hard-fail in CI
dead_code         = "warn"
unused_variables  = "warn"

[workspace.lints.clippy]
all  = "warn"   # surface all default clippy lints across every crate
