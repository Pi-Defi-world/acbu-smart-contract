[workspace]
members = [
    "acbu_minting",
    "acbu_burning",
    "acbu_oracle",
    "acbu_reserve_tracker",
    "acbu_savings_vault",
    "acbu_lending_pool",
    "acbu_escrow",
    "acbu_multisig",
    "shared",
    "verifier",
    "contracts/zk_verifier",
    "contracts/zk_gate",
    "contracts/zk_proof_verifier",
]
resolver = "2"

[workspace.package]
rust-version = "1.91.0"

# ---------------------------------------------------------------------------
# Workspace-wide dependency versions
#
# Use `=` (exact) requirements for Soroban SDK crates, not caret (`^`) or
# bare version strings.  A Soroban minor release can change WASM encoding,
# host-function signatures, gas cost tables, or XDR event shapes — all of
# which break on-chain compatibility without any change to contract source.
#
# To upgrade: bump *both* fields below (and run `cargo update` to regenerate
# Cargo.lock), then rebuild + re-test every contract before deploying.
#
# Supply chain (W2-Z-020): dependencies are registry-sourced except for the
# reviewed, commit-pinned ZK verifier crate documented below. CI rejects every
# other Git source and verifies that this exception remains pinned.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Exact pin — caret (`^`) is intentionally *not* used here.
# (Note: 21.0.0 was yanked from crates.io, using latest 21.x version)
soroban-sdk = "=21.7.7"
soroban-env-host = "=21.2.1"
# Pin serde_with to version compatible with the workspace toolchain.
serde_with = "=3.9.0"

# ---------------------------------------------------------------------------
# W10-SEC-002: `zk_proof_verifier` uses the pinned ZK-capable UltraHonk verifier
# from BuidlZone-Labs/zicket-contract. This verifier implements the
# UltraZK/Libra transcript required for Barretenberg 0.87.0 `--zk` proofs.
# `.github/workflows/deps-guard.yml` permits only this exact Git revision;
# all other dependencies remain registry-sourced.
# ---------------------------------------------------------------------------

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Enable link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Strip symbols
overflow-checks = true

[profile.release-with-logs]
inherits = "release"
debug = true

# ---------------------------------------------------------------------------
# Workspace-wide lint policy — enforced by `cargo clippy` in CI.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unused_imports    = "deny"   # the original hygiene issue; hard-fail in CI
dead_code         = "warn"
unused_variables  = "warn"

[workspace.lints.clippy]
all  = "warn"   # surface all default clippy lints across every crate
