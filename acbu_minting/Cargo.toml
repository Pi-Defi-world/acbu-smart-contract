[package]
name = "acbu_minting"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }
shared = { path = "../shared" }

[dev-dependencies]
proptest = "1.11.0"
soroban-sdk = { workspace = true, features = ['testutils'] }
serde_json = "1.0"

[lints]
workspace = true
