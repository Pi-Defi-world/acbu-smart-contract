name: Validate Test Snapshots

on:
  pull_request:
    paths:
      - 'acbu_minting/src/**'
      - 'acbu_minting/tests/**'
      - 'acbu_minting/test_snapshots/**'
      - 'shared/src/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'acbu_minting/src/**'
      - 'acbu_minting/tests/**'
      - 'acbu_minting/test_snapshots/**'
      - 'shared/src/**'

jobs:
  validate-snapshots:
    name: Validate Test Snapshots
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate snapshots
        run: |
          cargo test test_snapshot_validation --package acbu_minting -- --nocapture
        continue-on-error: false

      - name: Check for snapshot staleness
        if: failure()
        run: |
          echo "::error::❌ Test snapshot validation failed!"
          echo "::error::Snapshots may be stale after code refactoring."
          echo "::error::Please follow the Snapshot Management Guide:"
          echo "::error::  1. Review acbu_minting/SNAPSHOT_MANAGEMENT.md"
          echo "::error::  2. Update EXPECTED_STORAGE_KEYS and EXPECTED_EVENT_TYPES if needed"
          echo "::error::  3. Regenerate snapshots: make clean-snapshots && make test-minting"
          echo "::error::  4. Commit updated snapshots"
          exit 1

      - name: Report success
        if: success()
        run: |
          echo "✅ All test snapshots are valid and up-to-date"
