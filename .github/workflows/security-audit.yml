name: Security Audit

on:
  push:
    branches:
      - main
      - develop
      - dev
  pull_request:
    branches:
      - main
      - develop
      - dev

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Audit the exact dependency graph committed with the repository. Using
      # `--locked` makes CI fail if a manifest change would rewrite Cargo.lock
      # instead of silently auditing a freshly resolved graph.
      - name: Verify committed Cargo lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --file Cargo.lock
