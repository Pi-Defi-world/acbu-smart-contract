name: Dependency Supply-Chain Guard

# W2-Z-020 / AZ-005: Git dependencies must not be pulled from a floating
# branch or tag — every git dep must be pinned to an exact commit via `rev`.
# Prefer registry sources (crates.io) with checksums recorded in Cargo.lock
# so that builds are fully reproducible without live GitHub access.

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  no-git-deps:
    name: Forbid git/path dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow only the reviewed verifier Git dependency
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -rnE '^\s*[^#].*\bgit\s*=\s*"' --include=Cargo.toml . || true)"
          unexpected="$(printf '%s\n' "$hits" | grep -vE '^\./contracts/zk_proof_verifier/Cargo\.toml:[0-9]+:[[:space:]]*ultrazk-soroban-verifier[[:space:]]*=[[:space:]]*\{[[:space:]]*git = "https://github.com/BuidlZone-Labs/zicket-contract.git", rev = "424ebf38ff73848cfedfe4f0a94431425916b866"' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Only the reviewed, pinned UltraZK verifier Git dependency is allowed:"
            echo "$unexpected"
            exit 1
          fi
          echo "Only the reviewed UltraZK verifier Git dependency is declared."

      # AZ-005: Even when a git dep is technically present, a floating branch
      # or tag (no `rev`) means the source can silently change between builds,
      # breaking reproducibility and opening a supply-chain attack surface.
      # Reject any git dep that lacks a `rev = "<commit-sha>"` field.
      - name: Fail on git dependencies without a pinned `rev`
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' manifest; do
            # Collect all [dependencies.*] blocks that use `git =` but have no `rev`.
            # A well-formed pinned dep looks like:
            #   some-crate = { git = "https://...", rev = "abc1234" }
            # A floating dep (branch/tag only, or bare git) lacks `rev =`.
            python3 - "$manifest" <<'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          # Find every value that contains git = "..." but NOT rev = "..."
          # within the same dep entry (single-line or inline-table form).
          # This catches:
          #   foo = { git = "...", branch = "main" }   ← no rev → BAD
          #   foo = { git = "...", tag = "v1.0" }      ← no rev → BAD
          #   foo = { git = "...", rev = "abc1234" }   ← has rev → OK
          pattern = re.compile(
              r'\{[^}]*\bgit\s*=\s*"[^"]*"[^}]*\}',
          )
          bad = []
          for m in pattern.finditer(text):
              block = m.group(0)
              if 'rev' not in block:
                  # Find the dep name by looking backwards for the key
                  before = text[:m.start()]
                  name_match = re.search(r'(\S+)\s*=\s*$', before.rstrip())
                  dep_name = name_match.group(1) if name_match else '<unknown>'
                  bad.append((dep_name, block.strip()))

          if bad:
              for name, block in bad:
                  print(f"::error file={path}::AZ-005: git dep '{name}' is missing `rev`; "
                        f"floating branch/tag is not reproducible. Add rev = \"<commit-sha>\". "
                        f"Block: {block}")
              sys.exit(1)
          PYEOF
          done < <(find . -name 'Cargo.toml' -print0)
          echo "All git dependencies (if any) have a pinned rev."

      # W10-SEC-002: Keep the ZK-capable verifier and proof serialization pinned
      # to the reviewed commit. It implements the UltraZK/Libra transcript.
      - name: Enforce pinned UltraZK verifier revision (W10-SEC-002)
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_REV="424ebf38ff73848cfedfe4f0a94431425916b866"
          failed=0
          while IFS= read -r -d '' manifest; do
            python3 - "$manifest" "$CANONICAL_REV" <<'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1])
          canonical = sys.argv[2]
          text = path.read_text()

          # Match any inline-table dep entry that mentions the ZK verifier
          # package and contains a git = "..." field.
          pattern = re.compile(
              r'\{[^}]*\bgit\s*=\s*"[^"]*"[^}]*\}',
          )
          for m in pattern.finditer(text):
              block = m.group(0)
              # Only care about entries for the pinned UltraZK verifier crate.
              before = text[:m.start()]
              name_match = re.search(r'(\S+)\s*=\s*$', before.rstrip())
              dep_name = name_match.group(1) if name_match else ''
              if 'ultrazk' not in dep_name and 'ultrazk' not in block:
                  continue
              rev_match = re.search(r'\brev\s*=\s*"([^"]+)"', block)
              if not rev_match:
                  print(f"::error file={path}::AZ-006: '{dep_name}' has no `rev`; "
                        f"pin to rev = \"{canonical}\".")
                  sys.exit(1)
              actual_rev = rev_match.group(1)
              if actual_rev != canonical:
                  print(f"::error file={path}::AZ-006: '{dep_name}' is pinned to "
                        f"rev = \"{actual_rev}\" but the canonical rev is "
                        f"\"{canonical}\". All manifests must use the same commit "
                        f"to avoid mismatched VK/proof serialization.")
                  sys.exit(1)
          PYEOF
          done < <(find . -name 'Cargo.toml' -print0)
          echo "All UltraZK verifier deps (if any) use the canonical rev."

      - name: Enforce reviewed Git sources in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Cargo.lock ]]; then
            echo "::error::Cargo.lock is missing. Commit it for reproducible, offline-resolvable builds."
            exit 1
          fi
          python3 - <<'PYEOF'
          import re
          from pathlib import Path

          text = Path("Cargo.lock").read_text()
          sources = re.findall(r'^source = "(git\+[^"]+)"$', text, re.M)
          allowed = (
              "git+https://github.com/BuidlZone-Labs/zicket-contract.git"
              "?rev=424ebf38ff73848cfedfe4f0a94431425916b866"
              "#424ebf38ff73848cfedfe4f0a94431425916b866"
          )
          unexpected = [source for source in sources if source != allowed]
          if unexpected:
              for source in unexpected:
                  print(f"::error::Unreviewed git source in Cargo.lock: {source}")
              raise SystemExit(1)
          if not sources or set(sources) != {allowed}:
              print("::error::Cargo.lock must contain only the pinned UltraZK source.")
              raise SystemExit(1)
          print("Cargo.lock contains only the reviewed, pinned UltraZK git source.")
          PYEOF

      - name: Verify Soroban SDK provenance and versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import pathlib
          import tomllib

          root = pathlib.Path("Cargo.toml")
          lock = pathlib.Path("Cargo.lock")
          manifest = tomllib.loads(root.read_text())
          lockfile = tomllib.loads(lock.read_text())

          expected = {
              "soroban-sdk": {"21.7.7", "26.0.1"},
              "soroban-env-host": {"21.2.1"},
          }
          workspace_deps = manifest.get("workspace", {}).get("dependencies", {})
          packages = {
              package["name"]: []
              for package in lockfile.get("package", [])
              if package["name"] in expected
          }
          for package in lockfile.get("package", []):
              if package["name"] in packages:
                  packages[package["name"]].append(package)

          for name, versions in expected.items():
              declared = workspace_deps.get(name)
              if name == "soroban-sdk" and declared.lstrip("=") != "21.7.7":
                  raise SystemExit(
                      f"{name} must be pinned to 21.7.7 in workspace.dependencies; "
                      f"found {declared!r}"
                  )

              resolved = packages.get(name, [])
              resolved_versions = {package["version"] for package in resolved}
              if not versions.issubset(resolved_versions):
                  missing = ", ".join(sorted(versions - resolved_versions))
                  raise SystemExit(f"Cargo.lock is missing {name} version(s): {missing}")
              for package in resolved:
                  if not package.get("source", "").startswith(
                      "registry+https://github.com/rust-lang/crates.io-index"
                  ):
                      raise SystemExit(
                          f"{name} must resolve from crates.io, found {package.get('source')!r}"
                      )

          print("Soroban SDK dependencies use the pinned crates.io versions.")
          PYEOF

  offline-resolve:
    name: Resolve without live GitHub access
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-guard-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-guard-

      # Populate the local registry cache from the committed lockfile only.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # Now prove the dependency graph resolves with networking disabled and the
      # lockfile untouched. If anything needed GitHub, this step fails.
      - name: Verify graph resolves offline against Cargo.lock
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked
